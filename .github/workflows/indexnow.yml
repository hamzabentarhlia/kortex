name: IndexNow
on:
  push:
    branches: [main]
    paths: ["sitemap.xml", "**/index.html"]
  workflow_dispatch:
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit sitemap URLs
        run: python3 src/indexnow.py
