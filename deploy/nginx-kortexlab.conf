server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/kortexlab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kortexlab.me/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 301 https://www.kortexlab.me$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kortexlab.me;
    ssl_certificate     /etc/letsencrypt/live/kortexlab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kortexlab.me/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    return 301 https://www.kortexlab.me$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.kortexlab.me;
    return 301 https://www.kortexlab.me$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kortexlab.me;
    ssl_certificate     /etc/letsencrypt/live/kortexlab.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kortexlab.me/privkey.pem;

    root /var/www/kortexlab;
    index index.html;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/(fr/|ar/)?login/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    location ~* \.(css|js|webp|avif|jpg|png|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    error_page 404 /404.html;
}
